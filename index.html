<script>
const K='ketchapp_pos_v1',MN={cash:'Tunai',qris:'QRIS',ewallet:'E-Wallet',debit:'Debit'};
let D;const S={view:'login',sel:null,pin:'',cat:'',q:'',cart:[],disc:{t:'pct',v:0},pay:{m:'cash'},user:null,fail:0,lock:0};
const E=s=>document.querySelector(s),R=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey=t=>new Date(t).toLocaleDateString('sv'),sum=(a,k='total')=>a.reduce((s,t)=>s+t[k],0);
const P=id=>D.products.find(p=>p.id===id),T=id=>D.trx.find(t=>t.id===id),cats=()=>[...new Set(D.products.map(p=>p.cat))];
S.hd=S.rf=S.rt=dkey(Date.now());S.fl={};S.lk={};try{const o=JSON.parse(localStorage.getItem('ketchapp_pos_pl')||'{}');S.fl=o.f||{};S.lk=o.l||{}}catch(e){}const plSave=()=>{try{localStorage.setItem('ketchapp_pos_pl',JSON.stringify({f:S.fl,l:S.lk}))}catch(e){}};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kp'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
/* ---------- PENYIMPANAN: localStorage + IndexedDB + salinan harian + backup file ---------- */
let _db;const idb=()=>_db||(_db=new Promise((ok,no)=>{try{const r=indexedDB.open('ketchapp_pos_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onblocked=()=>no('blocked')}catch(e){no(e)}}));
const idbOp=(m,f)=>idb().then(db=>new Promise((ok,no)=>{const tx=db.transaction('kv',m),q=f(tx.objectStore('kv'));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=tx.onabort=()=>no(tx.error)}));
const idbPut=(k,v)=>idbOp('readwrite',s=>s.put(v,k)),idbGet=k=>idbOp('readonly',s=>s.get(k)),idbDel=k=>idbOp('readwrite',s=>s.delete(k)),idbKeys=()=>idbOp('readonly',s=>s.getAllKeys());
const tmo=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(undefined),ms))]);
let lsFail=0;
const save=nf=>{D.upd=Date.now();const j=JSON.stringify(D);let ok=1;try{localStorage.setItem(K,j)}catch(e){ok=0}
idbPut('main',j).then(()=>{if(!ok&&!lsFail){lsFail=1;toast('Penyimpanan utama penuh, memakai penyimpanan cadangan')}},()=>{if(!ok)toast('GAGAL MENYIMPAN! Segera backup data')});
if(!nf&&S.fh){clearTimeout(S.ft);S.ft=setTimeout(()=>fsWrite(),2500)}};
const okD=x=>x&&x.staff&&Array.isArray(x.trx)&&Array.isArray(x.products);
async function load(){let a=null,b=null;try{a=JSON.parse(localStorage.getItem(K))}catch(e){}
try{const j=await tmo(idbGet('main'),2500);if(j)b=JSON.parse(j)}catch(e){}
const nw=(x,y)=>(y.upd||0)>(x.upd||0)||((y.upd||0)===(x.upd||0)&&y.trx.length>x.trx.length);
let d=okD(a)?a:null;if(okD(b)&&(!d||nw(d,b)))d=b;
if(d&&d===b&&!okD(a))S.recov='Data dipulihkan dari penyimpanan cadangan browser';
if(!d){try{const ks=((await tmo(idbKeys(),2500))||[]).filter(k=>/^snap:\d/.test(k)).sort();for(let i=ks.length-1;i>=0&&!d;i--){const x=JSON.parse(await idbGet(ks[i]));if(okD(x)){d=x;S.recov='Data dipulihkan dari salinan otomatis '+ks[i].slice(5)}}}catch(e){}}

return `<div class="grid lg:grid-cols-12 gap-4 items-start"><div class="lg:col-span-8 space-y-3 min-w-0"><div class="flex gap-2"><div class="relative flex-1"><span class="absolute left-3 top-1/2 -translate-y-1/2 mu">${ic('search')}</span><input aria-label="Cari menu" oninput="S.q=this.value;E('#grid').innerHTML=grid()" value="${esc(S.q)}" placeholder="Cari menu..." class="inp !pl-10"></div><button onclick="holdListM()" class="btn so shrink-0" aria-label="Pesanan ditahan">${ic('pause')}<span class="hidden sm:inline ml-1">Ditahan</span>${D.holds.length?` <span class="bg-rose-500 text-white rounded-full text-[10px] px-2 ml-1">${D.holds.length}</span>`:''}</button></div><div class="hs flex gap-2 overflow-x-auto pb-2 -mx-1 px-1">${['Semua',...cats()].map((c,i)=>`<button onclick="setCat(${i})" class="btn !py-1.5 text-sm whitespace-nowrap ${(i?cats()[i-1]:'')===S.cat?'bg-slate-900 text-white':'so'}">${esc(c)}</button>`).join('')}</div><div id="grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">${grid()}</div></div><div id="cart" class="${cartCls()}">${cartH()}</div></div><div id="bar" class="lg:hidden fixed inset-x-0 bottom-[calc(3.5rem_+_env(safe-area-inset-bottom,0px))] z-30 px-3 pb-2">${barH()}</div><div class="h-16 lg:hidden"></div>`}
function setCat(i){S.cat=i?cats()[i-1]:'';render()}
const cartCls=()=>'lg:col-span-4 card p-4 lg:block lg:sticky lg:bottom-auto lg:inset-x-auto lg:z-10 lg:max-h-none lg:overflow-visible lg:rounded-b-2xl '+(S.co?'fixed inset-x-0 bottom-0 z-40 max-h-[85vh] overflow-y-auto rounded-b-none pb-[calc(1rem_+_env(safe-area-inset-bottom,0px))]':'hidden');
const barH=()=>{const n=S.cart.reduce((a,i)=>a+i.qty,0);return (S.co?'<div class="fixed inset-0 bg-slate-900/50 -z-10" onclick="S.co=0;upd()"></div>':'')+`<button ${n?'':'disabled'} onclick="S.co=1;upd()" class="btn bg-emerald-500 text-white w-full py-3 flex justify-between"><span>${ic('cart')} ${n} item</span><span>${n?R(calc().sub)+' '+ic('arrow'):'Pesanan kosong'}</span></button>`};
const ctH=()=>{const c=calc();return `<div class="flex justify-between text-sm mu"><span>Subtotal</span><span>${R(c.sub)}</span></div>${c.d?`<div class="flex justify-between text-sm text-emerald-600"><span>Diskon</span><span>-${R(c.d)}</span></div>`:''}<div class="flex justify-between text-sm mu"><span>Pajak ${D.cfg.tax}%</span><span>${R(c.tax)}</span></div><div class="flex justify-between text-lg font-bold"><span>Total</span><span>${R(c.total)}</span></div>`};
function qd(n){S.disc=S.disc.t==='pct'&&S.disc.v===n?{t:'pct',v:0}:{t:'pct',v:n};upd()}
function cd(){const t=E('#cdt').value;let v=Math.max(0,+E('#cdv').value||0);if(t==='pct'&&v>100){v=100;E('#cdv').value=100}S.disc={t,v};const e=E('#ctot');if(e)e.innerHTML=ctH()}
const upd=()=>{const c=E('#cart');if(c){c.className=cartCls();c.innerHTML=cartH()}const b=E('#bar');if(b)b.innerHTML=barH()};
function add(id){const p=P(id),l=S.cart.find(i=>i.id===id);if(p.stock!=null&&(l?l.qty:0)+1>p.stock)return toast('Stok tidak cukup');l?l.qty++:S.cart.push({id,qty:1,note:''});upd()}
function qty(x,d){const i=S.cart[x],p=P(i.id);if(d>0&&p.stock!=null&&i.qty+1>p.stock)return toast('Stok tidak cukup');i.qty+=d;if(i.qty<=0)S.cart.splice(x,1);if(!S.cart.length)S.disc={t:'pct',v:0};upd()}
function note(x){ask('Catatan item',{inp:S.cart[x].note,ph:'mis. less ice, no sugar',ok:'Simpan'},v=>{S.cart[x].note=v.slice(0,60);upd()})}

/* ---------- TAHAN PESANAN (HOLD) ---------- */
const hTot=h=>h.items.reduce((a,i)=>{const p=P(i.id);return a+(p?p.price*i.qty:0)},0);
function holdM(){if(!S.cart.length)return toast('Pesanan masih kosong');ask('Tahan pesanan',{m:'Pesanan disimpan dulu dan bisa dibuka lagi kapan saja. Stok baru dikurangi saat dibayar.',inp:'',ph:'Nama pelanggan / No. meja (opsional)',ok:'Tahan'},holdDo)}
function holdDo(label){if(!S.cart.length)return;D.holds.push({id:Date.now(),t:Date.now(),staff:S.user.name,label:(label||'').slice(0,40),items:S.cart.map(i=>({id:i.id,qty:i.qty,note:i.note||''})),disc:{t:S.disc.t,v:S.disc.v}});save();S.cart=[];S.co=0;S.disc={t:'pct',v:0};render();toast('Pesanan ditahan')}
function holdListM(){const L=[...D.holds].reverse();modal(`<h3 class="font-bold text-lg mb-3 pr-8">${ic('pause')} Pesanan ditahan</h3>${L.length?'':'<p class="mu text-center py-8">Tidak ada pesanan yang ditahan</p>'}<div class="space-y-2">${L.map(h=>`<div class="so rounded-2xl p-3"><div class="flex justify-between gap-2"><b class="truncate">${esc(h.label||'Tanpa nama')}</b><b class="whitespace-nowrap">${R(hTot(h))}</b></div><div class="text-xs mu">${new Date(h.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} · ${esc(h.staff)} · ${ago(h.t)}</div><div class="text-xs mu mt-1">${esc(h.items.map(i=>{const p=P(i.id);return i.qty+'x '+(p?p.name:'(produk dihapus)')}).join(', '))}</div><div class="flex gap-2 mt-2"><button onclick="holdResume(${h.id})" class="btn bg-emerald-500 text-white !py-1 flex-1 text-sm">Buka</button><button onclick="holdDel(${h.id})" class="btn bg-rose-500 text-white !py-1 !px-3 text-sm">Hapus</button></div></div>`).join('')}</div>`)}
function holdResume(id){if(!D.holds.some(x=>x.id===id))return;if(S.cart.length)return ask('Keranjang tidak kosong',{m:'Pesanan saat ini akan ikut ditahan (dengan label "Otomatis"), lalu pesanan terpilih dibuka.',ok:'Lanjut'},()=>{holdDo('Otomatis');holdLoad(id)});holdLoad(id)}
function holdLoad(id){const h=D.holds.find(x=>x.id===id);if(!h)return;let adj=0;const items=[];
h.items.forEach(i=>{const p=P(i.id);if(!p){adj++;return}let q=i.qty;if(p.stock!=null)q=Math.min(q,p.stock);if(q<=0){adj++;return}if(q<i.qty)adj++;items.push({id:i.id,qty:q,note:i.note||''})});
if(!items.length){closeM();return toast('Semua item pada pesanan ini sudah tidak tersedia (habis/dihapus)')}
D.holds=D.holds.filter(x=>x.id!==id);save();S.cart=items;S.disc=h.disc||{t:'pct',v:0};S.co=matchMedia('(min-width:1024px)').matches?0:1;closeM();render();toast(adj?'Pesanan dibuka, sebagian item disesuaikan (stok/produk berubah)':'Pesanan dibuka')}
function holdDel(id){const h=D.holds.find(x=>x.id===id);if(!h)return;ask('Hapus pesanan ditahan?',{m:(h.label||'Tanpa nama')+' · '+R(hTot(h))+'. Tidak bisa dikembalikan.',d:1,ok:'Hapus'},()=>{D.holds=D.holds.filter(x=>x.id!==id);save();render();holdListM()})}

/* ---------- PEMBAYARAN ---------- */
const sumH=()=>{const c=calc(),r=(a,b,x='')=>`<div class="flex justify-between ${x}"><span>${a}</span><span>${b}</span></div>`;return `<div class="so rounded-2xl p-3 text-sm space-y-1">${r('Subtotal',R(c.sub))}${c.d?r('Diskon','-'+R(c.d)):''}${r('Pajak '+D.cfg.tax+'%',R(c.tax))}${r('TOTAL',R(c.total),'text-2xl font-bold text-red-600 pt-1 border-t border-dashed')}</div>`};
function checkout(){S.pay={m:'cash'};coM()}
function coM(){const m=S.pay.m,rf=`<input id="ref" class="inp mt-2" placeholder="No. referensi / 4 digit kartu (opsional)">`;
modal(`<h3 class="text-xl font-bold mb-3">Pembayaran</h3><div id="sum">${sumH()}</div><div class="flex gap-2 my-3 items-center"><span class="text-xs mu">Diskon</span><input id="dv" type="number" min="0" value="${S.disc.v||''}" oninput="setDisc()" class="inp !w-24 !py-1"><select id="dt" onchange="setDisc()" class="inp !w-20 !py-1"><option value="pct" ${S.disc.t==='pct'?'selected':''}>%</option><option value="rp" ${S.disc.t==='rp'?'selected':''}>Rp</option></select></div><div class="grid grid-cols-4 gap-2 mb-3">${Object.entries(MN).map(([k,l])=>`<button onclick="S.pay.m='${k}';coM()" class="btn text-xs !px-1 ${m===k?'bg-emerald-500 text-white':'so'}"><div class="flex flex-col items-center gap-1">${ic(PMI[k])}${l}</div></button>`).join('')}</div>${m==='cash'?`<input id="cash" type="number" inputmode="numeric" onkeydown="if(event.key==='Enter')doPay()" oninput="chg()" placeholder="Uang diterima (Rp)" class="inp text-xl"><div class="grid grid-cols-4 gap-2 mt-2"><button onclick="setCash(0)" class="btn so text-xs">PAS</button>${[20000,50000,100000].map(n=>`<button onclick="setCash(${n})" class="btn so text-xs">${n/1000}k</button>`).join('')}</div><div id="chg" class="text-right mt-2 text-lg"></div>`:m==='qris'?`<div class="text-center">${D.cfg.qris?`<img src="${esc(D.cfg.qris)}" class="max-h-56 mx-auto rounded-xl bg-white">`:'<p class="mu text-sm">Gambar QRIS toko belum diunggah (Setelan).</p>'}<p class="text-xs mu mt-1">Pastikan notifikasi pembayaran sudah masuk sebelum konfirmasi.</p></div>${rf}`:rf}<button onclick="doPay()" class="btn bg-emerald-500 text-white w-full mt-4 py-3 text-lg sticky bottom-0">Konfirmasi Pembayaran</button>`);chg();E('#cash')?.focus()}
function setDisc(){S.disc={t:E('#dt').value,v:Math.max(0,+E('#dv').value||0)};E('#sum').innerHTML=sumH();chg();upd()}
function setCash(n){E('#cash').value=n||calc().total;chg()}
function chg(){const e=E('#chg');if(!e)return;const c=calc().total,v=+E('#cash').value||0;e.innerHTML=v>=c?`Kembalian <b class="text-emerald-600">${R(v-c)}</b>`:`Kurang <b class="text-rose-500">${R(c-v)}</b>`}
function doPay(){const c=calc(),m=S.pay.m;let paid=c.total;if(!S.cart.length)return;
if(m==='cash'){paid=Math.round(+E('#cash').value||0);if(paid<c.total)return toast('Uang diterima kurang')}
for(const i of S.cart){const p=P(i.id);if(p.stock!=null&&p.stock<i.qty)return toast('Stok '+p.name+' tidak cukup')}
const id=++D.seq,t={id,no:'INV-'+dkey(Date.now()).replace(/-/g,'').slice(2)+'-'+String(id).padStart(4,'0'),t:Date.now(),staff:S.user.name,shift:D.shift.id,items:S.cart.map(i=>{const p=P(i.id);return{pid:p.id,name:p.name,price:p.price,qty:i.qty,note:i.note}}),sub:c.sub,d:c.d,tp:D.cfg.tax,tax:c.tax,total:c.total,m,ref:(E('#ref')?.value||'').trim().slice(0,30),paid};
S.cart.forEach(i=>{const p=P(i.id);if(p.stock!=null)stk(p,p.stock-i.qty,'jual','',t.no)});D.trx.push(t);save();S.cart=[];S.co=0;S.disc={t:'pct',v:0};twBell();render();showRcp(id,1)}
const rcp=t=>{const r=(a,b,x='')=>`<div class="flex justify-between ${x}"><span>${a}</span><span>${b}</span></div>`,hr='<hr class="border-dashed border-black my-1">';return `<div class="bg-white text-black font-mono text-xs p-4 rounded-xl border-2 border-dashed border-amber-400"><div class="text-center font-bold text-sm">${esc(D.cfg.name)}</div><div class="text-center">${esc(D.cfg.addr)}</div><div class="text-center">${new Date(t.t).toLocaleString('id-ID')}</div><div class="mt-1">No: ${esc(t.no)}<br>Kasir: ${esc(t.staff)}</div>${hr}${t.items.map(i=>r(i.qty+'x '+esc(i.name),R(i.price*i.qty))+(i.note?`<div class="pl-3">- ${esc(i.note)}</div>`:'')).join('')}${hr}${r('Subtotal',R(t.sub))}${t.d?r('Diskon','-'+R(t.d)):''}${r('Pajak '+t.tp+'%',R(t.tax))}${r('TOTAL',R(t.total),'font-bold text-sm')}${r(MN[t.m]+(t.ref?' ('+esc(t.ref)+')':''),R(t.paid))}${t.m==='cash'?r('Kembali',R(t.paid-t.total)):''}${t.void?'<div class="text-center font-bold text-red-600">*** VOID ***</div>':''}<div class="text-center mt-2">${esc(D.cfg.foot)}</div></div>`};
function showRcp(id,n){modal(`<h3 class="text-xl font-bold mb-2">${n?ic('check','w-6 h-6 text-emerald-500')+' Pembayaran Berhasil':'Struk'}</h3>${rcp(T(id))}<div class="flex gap-2 mt-3"><button onclick="prn(${id})" class="btn so flex-1">${ic('printer')} Cetak</button><button onclick="closeM()" class="btn bg-blue-600 text-white flex-1">${n?'Transaksi Baru':'Tutup'}</button></div>`,'max-w-sm')}
function prn(id){E('#pr').innerHTML=rcp(T(id));try{window.print()}catch(e){toast('Cetak tidak tersedia di browser ini')}}

/* ---------- RIWAYAT ---------- */
function vHist(){const L=D.trx.filter(t=>dkey(t.t)===S.hd).reverse(),ok=L.filter(t=>!t.void),o=S.user.role==='owner';
return `<div class="card p-4"><div class="flex flex-wrap gap-3 items-center mb-3"><h2 class="font-bold text-lg">${ic('receipt')} Riwayat</h2><input type="date" value="${S.hd}" onchange="S.hd=this.value||S.hd;render()" class="inp !w-auto"><span class="ml-auto font-bold">${ok.length} trx · ${R(sum(ok))}</span></div><div class="space-y-2">${L.map(t=>`<div class="so rounded-2xl p-3 flex items-center gap-2 flex-wrap ${t.void?'opacity-60':''}"><div class="flex-1 min-w-[150px]"><div class="font-bold text-sm">${esc(t.no)} ${t.void?'<span class="text-rose-500">VOID</span>':''}</div><div class="text-xs mu">${new Date(t.t).toLocaleTimeString('id-ID')} · ${esc(t.staff)} · ${MN[t.m]}</div></div><b>${R(t.total)}</b><button onclick="showRcp(${t.id})" class="btn bg-blue-600 text-white !py-1 !px-3 text-xs">Struk</button>${o&&!t.void?`<button onclick="voidT(${t.id})" class="btn bg-rose-500 text-white !py-1 !px-3 text-xs">Void</button>`:''}</div>`).join('')||'<p class="mu text-center py-8">Belum ada transaksi pada tanggal ini</p>'}</div></div>`}
function voidT(id){const t=T(id);ask('Void '+t.no,{m:'Transaksi dibatalkan dan stok dikembalikan.',inp:'',ph:'Alasan void',req:1,d:1,ok:'Void'},r=>voidDo(t,r))}
function voidDo(t,r){t.void={r:r.slice(0,80),by:S.user.name,at:Date.now()};t.items.forEach(i=>{const p=P(i.pid);if(p&&p.stock!=null)stk(p,p.stock+i.qty,'void',r,t.no)});save();toast('Transaksi di-void, stok dikembalikan');render()}

/* ---------- LOG HISTORI STOK ---------- */
const SLT={jual:'Penjualan',void:'Void',manual:'Penyesuaian',awal:'Stok awal',edit:'Edit produk',hapus:'Hapus produk'},stTxt=v=>v==null?'∞':v;
function stk(p,nw,type,reason,ref){const b=p.stock;if(b===nw)return;D.slog.push({t:Date.now(),pid:p.id,name:p.name,by:S.user?S.user.name:'-',type,b,a:nw,r:(reason||'').slice(0,80),ref:ref||'',sh:D.shift?D.shift.id:null});p.stock=nw}
const vProd=()=>ptabs()+(S.pt==='log'?vSlog():vProd0());
const ptabs=()=>`<div class="flex gap-2 mb-3">${[['list','Produk'],['log','Riwayat Stok']].map(([k,l])=>`<button onclick="S.pt='${k}';render()" class="btn ${(S.pt||'list')===k?'bg-slate-900 text-white':'so'}">${l}</button>`).join('')}</div>`;
const slF=()=>D.slog.filter(x=>(!S.lp||String(x.pid)===String(S.lp))&&(!S.lu||x.by===S.lu)&&(!S.lf||dkey(x.t)>=S.lf)&&(!S.lt||dkey(x.t)<=S.lt)).reverse();
function vSlog(){const L=slF(),us=[...new Set(D.slog.map(x=>x.by))],ps=[...new Map(D.slog.map(x=>[x.pid,x.name])).entries()],
row=x=>{const dl=(x.b==null||x.a==null)?'':x.a-x.b,tx=x.type==='awal'?'Stok awal '+stTxt(x.a):x.type==='hapus'?'Dihapus (sisa '+stTxt(x.b)+')':stTxt(x.b)+' → '+stTxt(x.a);
return `<div class="so rounded-2xl p-3 text-sm flex flex-wrap items-center gap-2"><div class="flex-1 min-w-[150px]"><div class="font-bold">${esc(x.name)}</div><div class="text-xs mu">${new Date(x.t).toLocaleString('id-ID')} · oleh <b>${esc(x.by)}</b></div>${x.r||x.ref?`<div class="text-xs mu">${esc([x.ref,x.r].filter(Boolean).join(' · '))}</div>`:''}</div><div class="text-right"><span class="text-[10px] px-2 rounded-full bg-amber-100 text-amber-900">${esc(SLT[x.type]||x.type)}</span><div class="font-bold">${tx} ${dl!==''&&dl!==0?`<span class="${dl>0?'text-emerald-600':'text-rose-500'}">(${dl>0?'+':''}${dl})</span>`:''}</div></div></div>`};
return `<div class="card p-4"><div class="flex flex-wrap gap-2 items-center mb-3"><h2 class="font-bold text-lg mr-auto">${ic('db')} Riwayat Stok</h2><button onclick="slCsv()" class="btn bg-blue-600 text-white !py-1">Ekspor CSV</button></div><div class="flex flex-wrap gap-2 mb-3"><select aria-label="Filter produk" onchange="S.lp=this.value;render()" class="inp !w-auto"><option value="">Semua produk</option>${ps.map(([id,n])=>`<option value="${id}" ${String(S.lp)===String(id)?'selected':''}>${esc(n)}</option>`).join('')}</select><select aria-label="Filter pelaku" onchange="S.lu=this.value;render()" class="inp !w-auto"><option value="">Semua pelaku</option>${us.map(u=>`<option value="${esc(u)}" ${S.lu===u?'selected':''}>${esc(u)}</option>`).join('')}</select><input type="date" aria-label="Dari tanggal" value="${S.lf||''}" onchange="S.lf=this.value;render()" class="inp !w-auto"><span>–</span><input type="date" aria-label="Sampai tanggal" value="${S.lt||''}" onchange="S.lt=this.value;render()" class="inp !w-auto"></div><p class="text-xs mu mb-2">${L.length} catatan${L.length>200?' (menampilkan 200 terbaru, ekspor CSV untuk semuanya)':''}</p><div class="space-y-2">${L.slice(0,200).map(row).join('')||'<p class="mu text-center py-8">Belum ada catatan perubahan stok</p>'}</div></div>`}
function slCsv(){const q=qc,Ln=[['Waktu','Produk','Jenis','Stok sebelum','Stok sesudah','Perubahan','Oleh','No. transaksi','Alasan'].join(',')];
slF().forEach(x=>Ln.push([q(new Date(x.t).toLocaleString('id-ID')),q(x.name),q(SLT[x.type]||x.type),x.b==null?'':x.b,x.a==null?'':x.a,(x.b==null||x.a==null)?'':x.a-x.b,q(x.by),q(x.ref),q(x.r)].join(',')));tm('Ekspor Riwayat Stok (salin &amp; tempel ke Excel/Sheets)',Ln.join('\n'),0,'riwayat-stok.csv')}
function sm(id){const p=P(id);modal(`<h3 class="font-bold text-lg mb-1 pr-8">Ubah stok</h3><p class="text-sm mu mb-3">${esc(p.name)} · stok saat ini: <b>${p.stock==null?'tak terbatas':p.stock}</b></p><div class="space-y-2"><select id="sk" class="inp"><option value="add">Tambah stok (restock)</option><option value="sub">Kurangi stok (rusak/hilang)</option><option value="set">Atur ke jumlah tertentu</option></select><input id="sq" type="number" min="0" inputmode="numeric" class="inp" placeholder="Jumlah"><input id="sr2" class="inp" maxlength="80" placeholder="Alasan (wajib), mis. restock dari supplier" onkeydown="if(event.key==='Enter')smOk(${id})"></div><p class="text-xs mu mt-2">Dicatat atas nama <b>${esc(S.user.name)}</b>.</p><button onclick="smOk(${id})" class="btn bg-emerald-500 text-white w-full mt-3">Simpan</button>`)}
function smOk(id){const p=P(id),k=E('#sk').value,raw=E('#sq').value,q=Math.floor(+raw),r=E('#sr2').value.trim();if(raw===''||!(q>=0))return toast('Isi jumlah');if(!r)return toast('Alasan wajib diisi');
if(p.stock==null&&k!=='set')return toast('Stok tak terbatas, pakai "Atur ke jumlah tertentu"');

function restore(){try{const o=JSON.parse(E('#tx').value);if(!okD(o)||!o.cfg||!o.staff.some(x=>x.role==='owner'&&x.pin))throw 0;o.seq=Math.max(+o.seq||0,o.trx.reduce((m,t)=>Math.max(m,+t.id||0),0));ask('Timpa semua data?',{m:'Backup berisi '+o.products.length+' produk, '+o.trx.length+' transaksi, '+o.staff.length+' kasir'+(o.upd?' (disimpan '+new Date(o.upd).toLocaleString('id-ID')+')':'')+'. Semua data saat ini diganti; salinan data saat ini disimpan dulu di "Salinan otomatis".',d:1,ok:'Pulihkan'},async()=>{await snap('snap:pre-restore');D=o;mig();D.bk={t:Date.now(),seq:D.seq};save();logout()})}catch(e){toast('Format backup tidak valid')}}
async function snM(){let ks=[];try{ks=((await tmo(idbKeys(),2500))||[]).filter(k=>String(k).startsWith('snap:')).sort().reverse()}catch(e){}
modal(`<h3 class="font-bold text-lg mb-1 pr-8">Salinan otomatis</h3><p class="text-xs mu mb-2">1 salinan per hari (14 hari terakhir) + salinan sebelum pemulihan terakhir. Melindungi dari salah pulihkan, tapi BUKAN pengganti file backup (ikut hilang jika data situs dihapus).</p><div class="space-y-1">${ks.map(k=>`<div class="so rounded-xl px-3 py-2 flex items-center gap-2"><span class="flex-1 text-sm">${k==='snap:pre-restore'?'Sebelum pemulihan terakhir':esc(k.slice(5))}</span><button data-k="${esc(k)}" onclick="snRes(this.dataset.k)" class="btn bg-blue-600 text-white !py-1 !px-3 text-xs">Pulihkan</button></div>`).join('')||'<p class="mu text-sm">Belum ada salinan</p>'}</div>`)}
async function snRes(k){try{const x=JSON.parse(await idbGet(k));if(!okD(x))throw 0;ask('Pulihkan salinan '+k.slice(5)+'?',{m:x.products.length+' produk, '+x.trx.length+' transaksi. Data saat ini diganti (disimpan dulu sebagai salinan "sebelum pemulihan").',d:1,ok:'Pulihkan'},async()=>{if(k!=='snap:pre-restore')await snap('snap:pre-restore');D=x;mig();save();logout()})}catch(e){toast('Salinan tidak bisa dibaca')}}
function resetAll(){ask('Hapus SEMUA data?',{m:'Produk, transaksi, kasir, salinan otomatis, dan sambungan file backup akan hilang permanen. Ketik HAPUS untuk melanjutkan.',inp:'',req:1,d:1,ok:'Hapus semua'},async v=>{if(v!=='HAPUS')return toast('Konfirmasi tidak cocok');try{localStorage.removeItem(K)}catch(e){}try{await tmo(idbKeys().then(ks=>Promise.all(ks.map(k=>idbDel(k)))),3000)}catch(e){}location.reload()})}

(async()=>{D=await load();if(!D)D=await seed();mig();save(1);
S.sel=D.staff[0]?.id;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});window.addEventListener('beforeunload',e=>{if(S.cart&&S.cart.length){e.preventDefault();e.returnValue=''}});render();if(S.recov)toast(S.recov);
fsInit();persist();regSW();
